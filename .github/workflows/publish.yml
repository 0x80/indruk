name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      preid:
        description: Prerelease identifier (alpha, beta, rc). Only used with pre* bumps.
        required: false
        type: string
      explicit_version:
        description: Explicit version (e.g. 2.0.0-beta.1). Overrides bump and preid when set.
        required: false
        type: string
      dry_run:
        description: Dry run, which skips publish, push and release
        required: false
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main' || startsWith(inputs.bump, 'pre') || inputs.explicit_version != ''
    uses: ./.github/workflows/checks.yml

  publish:
    if: github.ref == 'refs/heads/main' || startsWith(inputs.bump, 'pre') || inputs.explicit_version != ''
    needs: checks
    runs-on: ubuntu-24.04
    # Trusted publishing authenticates through the OIDC token, so no npm token is stored.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          PREID: ${{ inputs.preid }}
          EXPLICIT_VERSION: ${{ inputs.explicit_version }}
        run: |
          if [[ -n "$EXPLICIT_VERSION" ]]; then
            npm version "$EXPLICIT_VERSION" --git-tag-version true
          else
            ARGS=("$BUMP")
            if [[ "$BUMP" == pre* && -n "$PREID" ]]; then
              ARGS+=(--preid "$PREID")
            fi
            npm version "${ARGS[@]}" --git-tag-version true
          fi

          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish summary
        run: |
          {
            echo "### Publish Summary"
            echo ""
            echo "- **Version:** ${{ steps.version.outputs.version }}"
            echo "- **Tag:** ${{ steps.version.outputs.tag }}"
            echo "- **Dist tag:** ${{ steps.version.outputs.dist_tag }}"
            echo "- **Prerelease:** ${{ steps.version.outputs.prerelease }}"
            echo "- **Dry run:** ${{ inputs.dry_run }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Publish before push: a version cannot be published twice, while a failed push can be retried.
      - name: Publish to npm
        if: ${{ inputs.dry_run == false }}
        run: npm publish --provenance --tag ${{ steps.version.outputs.dist_tag }}

      - name: Push version commit
        if: ${{ inputs.dry_run == false }}
        run: git push origin HEAD

      - name: Push version tag
        if: ${{ inputs.dry_run == false }}
        run: git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub Release
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          FLAGS=(--generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" "${FLAGS[@]}"
