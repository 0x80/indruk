name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Install scc
        run: |
          curl -fsSL https://github.com/boyter/scc/releases/download/v3.5.0/scc_Linux_x86_64.tar.gz | tar -xz -C "$RUNNER_TEMP" scc
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Check that the tag names the package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # Trusted publishing authenticates through the workflow's OIDC token and adds provenance, so no npm token is stored.
      - run: npm publish
